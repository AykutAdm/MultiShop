<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş Yap</title>
    <link rel="stylesheet" href="../css/login-form.css">
</head>
<body class="lf-page">

    <!-- Arka plan: vignette -->
    <div class="lf-vignette"></div>

    <!-- Arka plan: animasyonlu aksan çizgileri (3 yatay + 3 dikey, sıra önemli) -->
    <div class="lf-lines">
        <div class="lf-hline"></div>
        <div class="lf-hline"></div>
        <div class="lf-hline"></div>
        <div class="lf-vline"></div>
        <div class="lf-vline"></div>
        <div class="lf-vline"></div>
    </div>

    <!-- Arka plan: yükselen partiküller -->
    <canvas class="lf-particles"></canvas>

    <!-- Üst bar -->
    <header class="lf-header">
        <a class="lf-brand" href="#">Marka Adı</a>
        <a class="lf-btn lf-btn--outline" href="#">
            <span>İletişim</span>
            <svg class="lf-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
    </header>

    <!-- Giriş kartı -->
    <div class="lf-wrapper">
        <div class="lf-card">

            <div class="lf-card-header">
                <h1 class="lf-title">Tekrar hoş geldiniz</h1>
                <p class="lf-desc">
                    Hesabınıza giriş yapın ve kaldığınız yerden devam edin.
                </p>
            </div>

            <form class="lf-card-body" method="post" action="#">

                <!-- Hata kutusu: sunucudan hata dönerse bu bloğu gösterin -->
                <!--
                <div class="lf-alert" role="alert">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                    <span>Kullanıcı adı veya şifre hatalı.</span>
                </div>
                -->

                <div class="lf-field">
                    <label class="lf-label" for="email">E-posta</label>
                    <div class="lf-input-wrap">
                        <svg class="lf-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input class="lf-input" id="email" name="email" type="email" placeholder="siz@ornek.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="lf-field">
                    <label class="lf-label" for="password">Şifre</label>
                    <div class="lf-input-wrap">
                        <svg class="lf-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input class="lf-input lf-input--toggle" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="lf-toggle" data-lf-toggle="password" aria-pressed="false" aria-label="Şifreyi göster" data-lf-label-show="Şifreyi göster" data-lf-label-hide="Şifreyi gizle">
                            <svg class="lf-icon-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="lf-icon-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <div class="lf-meta">
                    <div class="lf-check">
                        <input type="checkbox" id="remember" name="remember" value="true">
                        <label for="remember">Beni hatırla</label>
                    </div>
                    <a class="lf-link" href="#">Şifremi unuttum</a>
                </div>

                <button type="submit" class="lf-btn">Giriş Yap</button>

                <div class="lf-separator"><span>veya</span></div>

                <div class="lf-btn-grid">
                    <a class="lf-btn lf-btn--ghost" href="#">
                        <svg class="lf-btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
                        GitHub
                    </a>
                    <a class="lf-btn lf-btn--ghost" href="#">
                        <svg class="lf-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" x2="12" y1="8" y2="8"/><line x1="3.95" x2="8.54" y1="6.06" y2="14"/><line x1="10.88" x2="15.46" y1="21.94" y2="14"/></svg>
                        Google
                    </a>
                </div>
            </form>

            <div class="lf-card-footer">
                <div>
                    Hesabınız yok mu?
                    <a href="register.html">Hemen kayıt olun</a>
                </div>
                <a class="lf-site-link" href="#">ornek.com</a>
            </div>

        </div>
    </div>

    <script src="../js/login-form.js"></script>
</body>
</html>
